[package]
name = "ppdrive_dashboard_router"
version.workspace = true
edition.workspace = true

[[bin]]
name = "test_server"
path = "src/bin/test_server.rs"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ppdrive = { path = "../../ppdrive/core", features = ["server"] }
jsonwebtoken = "9"
hex = "0.4"
time = "0.3"
tower = { version = "0.5", features = ["limit"] }
tower_governor = { version = "0.8", features = ["axum"] }
tracing = "0.1"
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal"] }
anyhow = "1"
